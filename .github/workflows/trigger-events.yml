name: Triggering Events

on:
    push:
        branches:
            - "example-branch/*"

    pull_request:
        types:
            - opened
            - synchronize
            - reopened
        paths:
            - "demo/03-core-features/filters/*.md" # include
            - "!demo/03-core-features/filters/*.txt" # exclude
    schedule:
        - cron: "0 0 * * *"

    workflow_dispatch:

jobs:
    echo-event:
        runs-on: ubuntu-24.04
        steps:
            - name: return full events JSON
              run: |   
                  echo "--- $GITHUB_EVENT_NAME payload ---"
                  cat "$GITHUB_EVENT_PATH"
